{% extends "base.html" %}

{% block title %}Search Results{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Search Results</h2>
    <div id="results" class="row row-cols-1 row-cols-md-3 g-4"></div>
    <div id="no-results" class="alert alert-warning d-none">No results found. Try a different search.</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const urlParams = new URLSearchParams(window.location.search);
  const query = urlParams.get('q') || '';

  if (query) {
    fetch(`/api/search?q=${encodeURIComponent(query)}`)
      .then(response => response.json())
      .then(data => {
        const resultsDiv = document.getElementById('results');
        const noResultsDiv = document.getElementById('no-results');
        resultsDiv.innerHTML = '';
        if (data && data.length > 0) {
          noResultsDiv.classList.add('d-none');
          data.forEach(res => {
            const col = document.createElement('div');
            col.className = 'col';

            const card = document.createElement('div');
            card.className = 'card h-100 shadow-sm';

            const img = document.createElement('img');
            img.src = res.image_url || 'https://via.placeholder.com/400x300?text=No+Image';
            img.alt = res.name || 'Image';
            img.className = 'card-img-top';
            img.loading = 'lazy';

            const cardBody = document.createElement('div');
            cardBody.className = 'card-body';

            const title = document.createElement('h5');
            title.className = 'card-title';
            title.textContent = res.name || '';

            const desc = document.createElement('p');
            desc.className = 'card-text';
            desc.textContent = res.description || '';

            cardBody.appendChild(title);
            cardBody.appendChild(desc);

            const cardFooter = document.createElement('div');
            cardFooter.className = 'card-footer text-center';

            const btn = document.createElement('a');
            btn.className = 'btn btn-outline-primary btn-sm';
            btn.href = `/create_trip?destination=${encodeURIComponent(res.name || '')}`;
            btn.textContent = 'Plan Your Trip';

            cardFooter.appendChild(btn);

            card.appendChild(img);
            card.appendChild(cardBody);
            card.appendChild(cardFooter);

            col.appendChild(card);
            resultsDiv.appendChild(col);
          });
        } else {
          noResultsDiv.classList.remove('d-none');
        }
      })
      .catch(err => {
        console.error('Error fetching search results:', err);
      });
  } else {
    document.getElementById('no-results').textContent = 'Please enter a search query.';
    document.getElementById('no-results').classList.remove('d-none');
  }
});
</script>
{% endblock %}
