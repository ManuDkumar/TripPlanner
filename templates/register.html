{% extends "base.html" %}
{% block title %}Register - TripPlanner{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="auth-card card shadow-lg mt-5 fade-in">
                <div class="card-body p-5">
                    <!-- Header -->
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus fa-3x text-success mb-3"></i>
                        <h3 class="mb-2">Create Account</h3>
                        <p class="text-muted">Start planning your adventures today</p>
                    </div>

                    <!-- Registration Form -->
                    <form method="POST" action="/register" id="registerForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="fas fa-user"></i> Username <span class="text-danger">*</span>
                            </label>
                            <input type="text" 
                                   class="form-control form-control-lg" 
                                   id="username" 
                                   name="username" 
                                   placeholder="Choose a username" 
                                   minlength="3"
                                   required 
                                   autofocus>
                            <small class="form-text text-muted">At least 3 characters</small>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope"></i> Email <span class="text-danger">*</span>
                            </label>
                            <input type="email" 
                                   class="form-control form-control-lg" 
                                   id="email" 
                                   name="email" 
                                   placeholder="your.email@example.com" 
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> Password <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <input type="password" 
                                       class="form-control form-control-lg" 
                                       id="password" 
                                       name="password" 
                                       placeholder="Create a strong password" 
                                       minlength="6"
                                       required>
                                <button class="btn btn-outline-secondary" 
                                        type="button" 
                                        onclick="togglePassword()">
                                    <i class="fas fa-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                            <small class="form-text text-muted">Minimum 6 characters</small>
                            
                            <!-- Password Strength Indicator -->
                            <div class="progress mt-2" style="height: 5px; display: none;" id="passwordStrength">
                                <div class="progress-bar" role="progressbar"></div>
                            </div>
                            <small id="strengthText" class="form-text"></small>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-check-circle"></i> Create Account
                            </button>
                        </div>
                    </form>

                    <!-- Divider -->
                    <div class="text-center mb-3">
                        <small class="text-muted">Already have an account?</small>
                    </div>

                    <!-- Login Link -->
                    <div class="d-grid">
                        <a href="/login" class="btn btn-outline-primary">
                            <i class="fas fa-sign-in-alt"></i> Log In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
    } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
    }
}

// Password strength indicator
document.getElementById('password').addEventListener('input', function() {
    const password = this.value;
    const strengthBar = document.getElementById('passwordStrength');
    const strengthText = document.getElementById('strengthText');
    const progressBar = strengthBar.querySelector('.progress-bar');
    
    if (password.length === 0) {
        strengthBar.style.display = 'none';
        strengthText.textContent = '';
        return;
    }
    
    strengthBar.style.display = 'block';
    
    let strength = 0;
    if (password.length >= 6) strength += 25;
    if (password.length >= 10) strength += 25;
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 25;
    if (/\d/.test(password)) strength += 15;
    if (/[^a-zA-Z\d]/.test(password)) strength += 10;
    
    progressBar.style.width = strength + '%';
    
    if (strength < 40) {
        progressBar.className = 'progress-bar bg-danger';
        strengthText.textContent = '❌ Weak password';
        strengthText.className = 'form-text text-danger';
    } else if (strength < 70) {
        progressBar.className = 'progress-bar bg-warning';
        strengthText.textContent = '⚠️ Medium password';
        strengthText.className = 'form-text text-warning';
    } else {
        progressBar.className = 'progress-bar bg-success';
        strengthText.textContent = '✅ Strong password';
        strengthText.className = 'form-text text-success';
    }
});
</script>

<style>
.auth-card {
    border: none;
    border-radius: 16px;
}

.auth-card .form-control:focus {
    border-color: var(--secondary-color);
    box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
}

.btn-outline-secondary:hover {
    background-color: transparent;
    color: #6c757d;
}
</style>
{% endblock %}
